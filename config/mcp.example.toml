# Merge the needed server entries into the Codex config.
# Use absolute paths and forward slashes on Windows. Each server reads its own source profile.
[mcp_servers.caa_ai_manual]
command = "<python-executable>"
args = ["<project-root>/tools/caa_manual_mcp_server.py", "--release", "R21"]
startup_timeout_sec = 30

[mcp_servers.caa_ai_manual_r33]
command = "<python-executable>"
args = ["<project-root>/tools/caa_manual_mcp_server.py", "--release", "R33"]
startup_timeout_sec = 30
